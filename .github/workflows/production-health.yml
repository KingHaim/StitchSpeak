name: Production health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  deep-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production readiness
        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            --max-time 20 \
            --retry 2 \
            --retry-delay 5 \
            https://stitchspeak-production.up.railway.app/health/deep
      - name: Check payment reconciliation
        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            --max-time 20 \
            --retry 2 \
            --retry-delay 5 \
            https://stitchspeak-production.up.railway.app/health/payments
