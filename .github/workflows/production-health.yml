name: Production health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ALERT_TITLE: '[Production Alert] StitchSpeak health check failing'
    steps:
      - name: Check user-facing production health
        id: health
        shell: bash
        run: |
          set -uo pipefail
          report_file="$RUNNER_TEMP/health-report.md"
          : > "$report_file"
          failed=0

          check() {
            local name="$1"
            local url="$2"
            local response code body
            response=$(curl --silent --show-error --max-time 20 --retry 2 --retry-delay 5 \
              --write-out $'\n%{http_code}' "$url" 2>&1 || true)
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
              printf -- '- ✅ %s (`%s`)\n' "$name" "$code" >> "$report_file"
            else
              failed=1
              body=$(printf '%s' "$body" | head -c 800)
              printf -- '- ❌ %s (`%s`)\n\n```text\n%s\n```\n' "$name" "$code" "$body" >> "$report_file"
            fi
          }

          check 'Public website' 'https://stitchspeak.com/'
          check 'API readiness' 'https://stitchspeak-production.up.railway.app/health/deep'
          check 'Payment reconciliation' 'https://stitchspeak-production.up.railway.app/health/payments'
          check 'Encrypted offsite backups' 'https://stitchspeak-production.up.railway.app/health/backups'
          check 'API error rate and latency' 'https://stitchspeak-production.up.railway.app/health/metrics'
          check 'Expired-data cleanup' 'https://stitchspeak-production.up.railway.app/health/maintenance'

          if [[ "$failed" -eq 0 ]]; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
          fi
          echo "report_file=$report_file" >> "$GITHUB_OUTPUT"

      - name: Open or update production alert
        if: steps.health.outputs.healthy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$ALERT_TITLE in:title" --json number --jq '.[0].number // empty')
          {
            echo 'Automated production health check failed.'
            echo
            cat "${{ steps.health.outputs.report_file }}"
            echo
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/alert-body.md"

          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/alert-body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" \
              --assignee "${GITHUB_REPOSITORY_OWNER}" --body-file "$RUNNER_TEMP/alert-body.md"
          fi

      - name: Close alert after recovery
        if: steps.health.outputs.healthy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$ALERT_TITLE in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
              --comment "✅ Production recovered. All health checks passed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')."
          fi

      - name: Fail workflow when production is unhealthy
        if: steps.health.outputs.healthy != 'true'
        run: exit 1
