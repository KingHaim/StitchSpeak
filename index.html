      }
      .ss-shell-hero {
        min-height: 100dvh;
        display: grid;
        align-items: center;
        padding: 72px max(24px, calc((100vw - 1280px) / 2)) 48px;
        background:
          linear-gradient(90deg, rgba(248,241,231,0.98) 0%, rgba(248,241,231,0.92) 42%, rgba(248,241,231,0.36) 100%),
          url("/stitchspeak-hero-bg-optimized.jpg") 65% center / cover no-repeat;
      }
      .ss-shell h1 {
        max-width: 760px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.1rem, 6.4vw, 5.9rem);
        line-height: 0.9;
        letter-spacing: -0.035em;
      }
      .ss-shell p {
        max-width: 590px;
        margin: 24px 0 0;
        color: #5f574d;
        font-size: 1.125rem;
        line-height: 1.75;
      }
